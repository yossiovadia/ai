---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-katan
  namespace: ai-gateway-dogfood
  labels:
    app: llm-katan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-katan
  template:
    metadata:
      labels:
        app: llm-katan
    spec:
      containers:
        - name: llm-katan
          image: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/llm-katan:latest
          args:
            - "--model=benchmark-echo"
            - "--backend=echo"
            - "--providers=openai,anthropic"
            - "--port=8000"
            - "--ttft-ms=800"
            - "--itl-ms=15"
            - "--error-rate=0"
            - "--max-concurrent=100"
            - "--disable-dashboard"
          env:
            - name: LLM_KATAN_PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: llm-katan
  namespace: ai-gateway-dogfood
  labels:
    app: llm-katan
spec:
  selector:
    app: llm-katan
  ports:
    - name: http
      port: 8000
      targetPort: 8000
