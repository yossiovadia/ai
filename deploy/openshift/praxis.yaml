---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: ai-gateway-dogfood
data:
  praxis.yaml: |
    listeners:
      - name: gateway
        address: "0.0.0.0:8080"
        filter_chains:
          - main

    filter_chains:
      - name: main
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "x-api-key"
            cache_ttl_seconds: 300
            timeout_seconds: 5

          - filter: identity_header_guard
            prefix: "x-tenant-"

          - filter: router
            routes:
              - path_prefix: "/"
                cluster: anthropic

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            default_model: "unknown"

          - filter: token_count
            provider: anthropic

          - filter: token_usage_headers

          - filter: credential_injection
            clusters:
              - name: anthropic
                header: x-api-key
                env_var: ANTHROPIC_API_KEY
                strip_client_credential: true

          - filter: headers
            request_set:
              - name: "Host"
                value: "api.anthropic.com"
              - name: "anthropic-version"
                value: "2023-06-01"

          - filter: load_balancer
            clusters:
              - name: anthropic
                tls:
                  sni: "api.anthropic.com"
                endpoints:
                  - "api.anthropic.com:443"
---
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-credentials
  namespace: ai-gateway-dogfood
type: Opaque
stringData:
  ANTHROPIC_API_KEY: CHANGE-ME-BEFORE-DEPLOY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: ai-gateway-dogfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      containers:
        - name: praxis
          image: quay.io/yossiovadia/praxis-ai:dogfood
          args: ["-c", "/etc/praxis/praxis.yaml"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9901
              name: admin
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthy
              port: 9901
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: ai-gateway-dogfood
spec:
  selector:
    app: praxis
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9901
      targetPort: 9901
