---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: ai-gateway-dogfood
data:
  praxis.yaml: |
    admin:
      address: "0.0.0.0:9901"

    insecure_options:
      allow_public_admin: true

    listeners:
      - name: anthropic
        address: "0.0.0.0:8080"
        filter_chains:
          - anthropic

      - name: openai
        address: "0.0.0.0:8081"
        filter_chains:
          - openai

      - name: benchmark
        address: "0.0.0.0:8082"
        filter_chains:
          - benchmark

    filter_chains:
      - name: anthropic
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "x-api-key"
            cache_ttl_seconds: 300
            timeout_seconds: 5

          - filter: identity_header_guard
            prefix: "x-tenant-"

          - filter: router
            routes:
              - path_prefix: "/"
                cluster: anthropic

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            default_model: "unknown"

          - filter: token_count
            provider: anthropic

          - filter: token_usage_headers

          - filter: credential_injection
            clusters:
              - name: anthropic
                header: x-api-key
                env_var: ANTHROPIC_API_KEY
                strip_client_credential: true

          - filter: headers
            request_set:
              - name: "Host"
                value: "api.anthropic.com"
              - name: "anthropic-version"
                value: "2023-06-01"

          - filter: load_balancer
            clusters:
              - name: anthropic
                tls:
                  sni: "api.anthropic.com"
                endpoints:
                  - "api.anthropic.com:443"

      - name: openai
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "authorization"
            cache_ttl_seconds: 300
            timeout_seconds: 5

          - filter: identity_header_guard
            prefix: "x-tenant-"

          - filter: router
            routes:
              - path_prefix: "/"
                cluster: openai

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            default_model: "unknown"

          - filter: token_count
            provider: openai

          - filter: token_usage_headers

          - filter: credential_injection
            clusters:
              - name: openai
                header: Authorization
                env_var: OPENAI_API_KEY
                header_prefix: "Bearer "
                strip_client_credential: true

          - filter: headers
            request_set:
              - name: "Host"
                value: "api.openai.com"

          - filter: load_balancer
            clusters:
              - name: openai
                tls:
                  sni: "api.openai.com"
                endpoints:
                  - "api.openai.com:443"

      - name: benchmark
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "x-api-key"
            cache_ttl_seconds: 300
            timeout_seconds: 5

          - filter: identity_header_guard
            prefix: "x-tenant-"

          - filter: router
            routes:
              - path_prefix: "/"
                cluster: llm-katan

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai-benchmark"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            default_model: "unknown"

          - filter: token_count
            provider: anthropic

          - filter: token_usage_headers

          - filter: headers
            request_set:
              - name: "x-api-key"
                value: "llm-katan-anthropic-key"
              - name: "anthropic-version"
                value: "2023-06-01"

          - filter: load_balancer
            clusters:
              - name: llm-katan
                endpoints:
                  - "llm-katan:8000"
---
# NOTE: provider-credentials Secret is created by deploy.sh from
# env vars (ANTHROPIC_API_KEY, OPENAI_API_KEY). Do NOT include it
# in this manifest — oc apply would overwrite real keys with placeholders.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: ai-gateway-dogfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      containers:
        - name: praxis
          image: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai:latest
          args: ["-c", "/etc/praxis/praxis.yaml"]
          ports:
            - containerPort: 8080
              name: anthropic
            - containerPort: 8081
              name: openai
            - containerPort: 8082
              name: benchmark
            - containerPort: 9901
              name: admin
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthy
              port: 9901
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: ai-gateway-dogfood
spec:
  selector:
    app: praxis
  ports:
    - name: anthropic
      port: 8080
      targetPort: 8080
    - name: openai
      port: 8081
      targetPort: 8081
    - name: benchmark
      port: 8082
      targetPort: 8082
    - name: admin
      port: 9901
      targetPort: 9901
